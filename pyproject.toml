[project]
name = "my_crewai"
version = "0.1.0"
description = "my_crewai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm]==1.14.4",
]

[project.scripts]
my_crewai = "my_crewai.main:run"
run_crew = "my_crewai.main:run"
train = "my_crewai.main:train"
replay = "my_crewai.main:replay"
test = "my_crewai.main:test"
run_with_trigger = "my_crewai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
